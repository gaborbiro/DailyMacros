# Unit tests run against a plain Application, never the production App: App.onCreate() starts
# process-lifetime coroutines (widget reloader, Health Connect sync, meal reminders) that watch the
# real Room database. They outlive the test, fail once Robolectric deletes its sandbox files, and
# kotlinx-coroutines-test then reports that failure in whichever runTest comes next.
application=android.app.Application
