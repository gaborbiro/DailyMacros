name: Deploy Firebase web

# Manual only, like the backend deploy: Actions tab -> "Deploy Firebase web" ->
# Run workflow. Publishes the closed-test landing page (web/) to Firebase
# Hosting. The page's /api/join rewrite points at the joinTest function, so the
# default target deploys that function alongside Hosting; pick "hosting" alone
# for page-only edits once joinTest is live. Uses the same service account
# secret as the backend deploy (firebase.admin covers Hosting).
on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'firebase deploy --only <targets>'
        required: true
        default: 'hosting,functions:joinTest'
        type: choice
        options:
          - hosting,functions:joinTest
          - hosting

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax-check functions
        working-directory: functions
        run: |
          for f in *.js; do node -c "$f"; done

      - name: Install function dependencies
        working-directory: functions
        run: npm ci

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy
        env:
          TARGETS: ${{ inputs.targets }}
        run: firebase deploy --only "$TARGETS" --project dailymacros-9fab8 --non-interactive
