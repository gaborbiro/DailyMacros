name: Deploy landing page

# Manual only: Actions tab -> "Deploy landing page" -> Run workflow. You can
# pick ANY branch to run this from via the "Use workflow from" dropdown on
# that screen - that's a built-in GitHub Actions feature for workflow_dispatch,
# nothing extra needed here. That's how you test-deploy a branch's Firebase
# changes without merging first.
#
# `channel`: leave empty to deploy hosting to the LIVE site (the original
# behavior). Set it to a short name (e.g. "test-waitlist") to instead deploy
# hosting to a temporary preview channel - a separate URL, left untouched by
# the live site, auto-expiring after 30 days - and get that URL back as this
# run's job summary, so you can open it anywhere (e.g. your phone). `channel`
# is ignored if `targets` doesn't include "hosting".
#
# Cloud Functions have no preview mode - there's only one live deployment per
# function name - so whatever's listed in `targets` under functions: always
# deploys live, on whichever branch you ran this from, regardless of `channel`.
# That's the trade-off for testing real Firebase behavior (Firestore writes,
# email alerts, etc.) before merging: the functions involved do go live, but
# only when you explicitly run this, never automatically.
on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'firebase deploy --only <targets>'
        required: true
        default: 'hosting,functions:joinWaitlist,functions:joinTest,functions:trackEvent'
        type: choice
        options:
          - hosting,functions:joinWaitlist,functions:joinTest,functions:trackEvent
          - hosting
      channel:
        description: 'Preview channel name (leave empty to deploy hosting live)'
        required: false
        default: ''
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax-check functions
        working-directory: functions
        run: |
          for f in *.js lib/*.js; do node -c "$f"; done

      - name: Install function dependencies
        working-directory: functions
        run: npm ci

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy
        env:
          TARGETS: ${{ inputs.targets }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -e
          IFS=',' read -ra PARTS <<< "$TARGETS"
          FUNC_PARTS=()
          HAS_HOSTING=false
          for p in "${PARTS[@]}"; do
            if [ "$p" = "hosting" ]; then
              HAS_HOSTING=true
            else
              FUNC_PARTS+=("$p")
            fi
          done

          if [ "${#FUNC_PARTS[@]}" -gt 0 ]; then
            FUNC_TARGETS=$(IFS=,; echo "${FUNC_PARTS[*]}")
            echo "Deploying functions: $FUNC_TARGETS"
            firebase deploy --only "$FUNC_TARGETS" --project dailymacros-9fab8 --non-interactive
          fi

          if [ "$HAS_HOSTING" = true ]; then
            if [ -n "$CHANNEL" ]; then
              echo "Deploying hosting to preview channel: $CHANNEL"
              RESULT=$(firebase hosting:channel:deploy "$CHANNEL" --project dailymacros-9fab8 --expires 30d --non-interactive --json)
              echo "$RESULT"
              URL=$(echo "$RESULT" | jq -r '.result | to_entries[0].value.url')
              {
                echo "### Preview URL"
                echo ""
                echo "**$URL**"
                echo ""
                echo "Branch: \`${GITHUB_REF_NAME}\`  "
                echo "Channel: \`${CHANNEL}\` (expires in 30 days)"
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "Deploying hosting to the live site"
              firebase deploy --only hosting --project dailymacros-9fab8 --non-interactive
            fi
          fi
