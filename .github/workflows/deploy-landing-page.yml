name: Deploy landing page

# Manual only, like the backend deploy: Actions tab -> "Deploy landing page" ->
# Run workflow. Publishes the landing page (web/) to Firebase Hosting. The
# page's /api/waitlist, /api/join and /api/event rewrites point at the
# joinWaitlist, joinTest and trackEvent functions, so the default target
# deploys all three alongside Hosting; pick "hosting" alone for page-only
# edits once they're live. Uses the same service account secret as the
# backend deploy (firebase.admin covers Hosting).
on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'firebase deploy --only <targets>'
        required: true
        default: 'hosting,functions:joinWaitlist,functions:joinTest,functions:trackEvent'
        type: choice
        options:
          - hosting,functions:joinWaitlist,functions:joinTest,functions:trackEvent
          - hosting

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax-check functions
        working-directory: functions
        run: |
          for f in *.js lib/*.js; do node -c "$f"; done

      - name: Install function dependencies
        working-directory: functions
        run: npm ci

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy
        env:
          TARGETS: ${{ inputs.targets }}
        run: firebase deploy --only "$TARGETS" --project dailymacros-9fab8 --non-interactive
