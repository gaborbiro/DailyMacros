name: Release

on:
  push:
    branches: [ "release" ]
  pull_request:
    branches: [ "release" ]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        # Full history so `git rev-list --count HEAD` (the versionCode source) is accurate;
        # a shallow clone would report 1.
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run unit tests
      run: ./gradlew testDebugUnitTest --stacktrace

    # ── Debug APK ──────────────────────────────────────────────
    - name: Build debug APK
      run: ./gradlew assembleDebug

    # ── Release AAB (signed) ───────────────────────────────────
    - name: Decode release keystore
      env:
        RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      run: |
        echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > /tmp/release-keystore.jks

    - name: Build signed release AAB and APK
      env:
        RELEASE_KEYSTORE_PATH: /tmp/release-keystore.jks
        RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      # Scoped to :app — the unqualified "assembleRelease" lifecycle task exists in every
      # subproject, so running it bare fans out into the library modules too and fails: their
      # standalone release resource verification can't resolve theme attrs (e.g.
      # ?attr/colorControlNormal) that only resolve once merged into the app's own theme.
      run: ./gradlew bundleRelease :app:assembleRelease

    # ── Collect artifacts ──────────────────────────────────────
    # Tag matches app/build.gradle.kts (appVersionName); Gradle writes app/build/release-version-name.txt
    - name: Collect release artifacts
      run: |
        VERSION=$(cat app/build/release-version-name.txt | tr -d ' \r\n\t')
        if [ -z "$VERSION" ]; then
          echo "Missing app/build/release-version-name.txt (bundleRelease should run writeAppReleaseVersionNameFile)" >&2
          exit 1
        fi
        echo "APP_VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
        mkdir -p release-artifacts
        cp app/build/outputs/apk/debug/DailyMacros-*.apk release-artifacts/ 2>/dev/null || true
        cp app/build/outputs/apk/release/DailyMacros-*.apk release-artifacts/ 2>/dev/null || true
        cp app/build/outputs/bundle/release/DailyMacros-*.aab release-artifacts/ 2>/dev/null || true
        ls -lh release-artifacts/

    # PRs against `release` only validate that the signed build succeeds, so they get a
    # throwaway prerelease tag distinct from the real v<version> tag used on an actual merge.
    - name: Set release tag/name
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          echo "RELEASE_TAG=pr-${{ github.event.pull_request.number }}-$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=PR #${{ github.event.pull_request.number }} signed build (${{ env.APP_VERSION_NAME }})" >> "$GITHUB_ENV"
        else
          echo "RELEASE_TAG=v${{ env.APP_VERSION_NAME }}" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=v${{ env.APP_VERSION_NAME }}" >> "$GITHUB_ENV"
        fi

    # ── GitHub Release ─────────────────────────────────────────
    # On push, this is the real release. On a same-repo PR, it's a prerelease so the signed
    # AAB/APK can be downloaded directly (no zip) without publishing to Google Play.
    - name: Create GitHub Release
      if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        name: ${{ env.RELEASE_NAME }}
        draft: false
        prerelease: ${{ github.event_name == 'pull_request' }}
        make_latest: ${{ github.event_name == 'push' }}
        generate_release_notes: true
        files: release-artifacts/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # ── Google Play Store ──────────────────────────────────────
    # Only on an actual merge to `release` — never on a PR build.
    - name: Upload to Google Play (internal testing)
      if: github.event_name == 'push'
      uses: r0adkll/upload-google-play@v1
      with:
        serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        packageName: dev.gaborbiro.dailymacros
        releaseFiles: release-artifacts/DailyMacros-*-release.aab
        tracks: internal
        status: completed
