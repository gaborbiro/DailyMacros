name: Deploy Firebase functions

# Manual only, on purpose: this deploys the live OpenAI proxy and
# subscription-verification functions, which can change real enforcement
# behavior for real users (see functions/README.md). Trigger it yourself from
# the Actions tab -> "Deploy Firebase functions" -> Run workflow, whenever
# you've decided a deploy should happen. No path-based auto-detection.
on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'firebase deploy --only <targets>'
        required: true
        default: 'functions,firestore:rules'
        type: choice
        options:
          - functions,firestore:rules
          - functions
          - firestore:rules

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Cheap smoke test before anything touches production - functions/ has no
      # test suite (see functions/package.json), so this is the only automated
      # gate standing between a typo and a live deploy.
      - name: Syntax-check functions
        working-directory: functions
        run: |
          for f in *.js; do node -c "$f"; done

      - name: Install function dependencies
        working-directory: functions
        run: npm ci

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy
        env:
          TARGETS: ${{ inputs.targets }}
        run: firebase deploy --only "$TARGETS" --project dailymacros-9fab8 --non-interactive
