name: Deploy Firebase functions

# Fires automatically once a merge to master actually touches the proxy or
# Firestore rules (the `paths` filter below) - this deploys the live OpenAI
# proxy and subscription-verification functions, which can change real
# enforcement behavior for real users (see functions/README.md), so it's
# scoped tightly on purpose: master only, and only when the relevant files
# changed. `workflow_dispatch` stays available as a manual escape hatch (e.g.
# re-running after fixing a secret) but is no longer the primary trigger.
on:
  push:
    branches: [ "master" ]
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - '.github/workflows/firebase-deploy.yml'
  workflow_dispatch:
    inputs:
      targets:
        description: 'firebase deploy --only <targets>'
        required: true
        default: 'functions,firestore:rules'
        type: choice
        options:
          - functions,firestore:rules
          - functions
          - firestore:rules

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Cheap smoke test before anything touches production - functions/ has no
      # test suite (see functions/package.json), so this is the only automated
      # gate standing between a typo and a live deploy.
      - name: Syntax-check functions
        working-directory: functions
        run: |
          for f in *.js; do node -c "$f"; done

      - name: Install function dependencies
        working-directory: functions
        run: npm ci

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy
        env:
          TARGETS: ${{ inputs.targets || 'functions,firestore:rules' }}
        run: firebase deploy --only "$TARGETS" --project dailymacros-9fab8 --non-interactive
