name: Deploy Firebase functions

# Manual only - this deploys the live OpenAI proxy and subscription-verification
# functions, which can change real enforcement behavior for real users (see
# functions/README.md). Never wire this to run automatically on push.
on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'firebase deploy --only <targets>'
        required: true
        default: 'functions'
        type: choice
        options:
          - functions
          - functions,firestore:rules
          - firestore:rules

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install function dependencies
        working-directory: functions
        run: npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy
        run: firebase deploy --only ${{ inputs.targets }} --project dailymacros-9fab8 --non-interactive
